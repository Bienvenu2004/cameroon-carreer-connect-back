spring:
  application:
    name: jobportal
    version: 0.0.1-SNAPSHOT
  flyway:
    url: ${DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jwt:
    accessTokenExpiration: 900000
    refreshTokenExpiration: 604800000
    maxRefreshAge: 86400000
    secret: ${JWT_SECRET}
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        jdbc:
          batch_size: 20
          order_inserts: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    from: ${MAIL_FROM}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  output:
    ansi:
      enabled: always

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 10MB
    max-parameter-count: 10000

logging:
  level:
    root: INFO
    org:
      springframework:
        web: INFO

app:
  cookies:
    secure: ${SECURE_COOKIES:false}
  client-url: ${CLIENT_URL}
  logo-url: ${LOGO_URL:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  # ---------------------------------------------------------------------
  # OAuth2 / social sign-in
  #
  # Google Sign-In uses the ID-token flow: the SPA obtains a Google
  # credential (a signed JWT) and posts it to /api/hjp/auth/google. The
  # backend verifies it against Google using this client-id as the
  # expected audience. Use the SAME OAuth 2.0 Web client-id on the
  # frontend (VITE_GOOGLE_CLIENT_ID). If blank, the endpoint returns a
  # clear 503 and the Google buttons stay non-functional — the rest of
  # the app is unaffected.
  # ---------------------------------------------------------------------
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

  # ---------------------------------------------------------------------
  # AI configuration
  #
  # Powers the seeker-side recommendations + (later) the conversational
  # assistant. We talk to Google Gemini via the Generative Language REST
  # API using Java 21's built-in HttpClient — no extra dependency.
  #
  # If `api-key` is blank the AI features short-circuit gracefully and
  # the recommendations endpoint returns an empty list. That keeps local
  # dev usable without a key.
  # ---------------------------------------------------------------------
  ai:
    gemini:
      base-url: https://generativelanguage.googleapis.com
      api-key: ${GEMINI_API_KEY:}
      model: gemini-flash-latest
      temperature: 0.3
      max-tokens: 4096
      timeout-seconds: 60
      # Explicit "thinking" token budget. Leave <= 0 to omit it entirely
      # and let the model use its default. NOTE: gemini-flash-latest now
      # resolves to a Gemini 3.x thinking model, which returns HTTP 400 if
      # thinkingBudget is 0 — so never set this to 0. Use a positive value
      # (e.g. 512) only if you want to cap thinking on a model that allows it.
      thinking-budget: -1
    recommendations:
      candidate-pool-size: 50      # max jobs we send to the model per request
      return-size: 5               # max jobs the model returns to the user


